[workspace]
resolver = "2"
members = [
    "crates/3bcad-core",
    "crates/3bcad-sketch",
    "crates/3bcad-kernel",
    "crates/3bcad-render",
    "crates/3bcad-io",
    "crates/3bcad-app",
]
exclude = ["fuzz"]

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Three-Bugs-Studio/3bcad"
rust-version = "1.87"

[workspace.dependencies]
# Internal crates (Cargo package names cannot start with a digit, hence `threebcad-*`)
threebcad-core = { path = "crates/3bcad-core" }
threebcad-sketch = { path = "crates/3bcad-sketch" }
threebcad-kernel = { path = "crates/3bcad-kernel" }
threebcad-render = { path = "crates/3bcad-render" }
threebcad-io = { path = "crates/3bcad-io" }

# Rendering & windowing (eframe = winit + egui-winit + egui-wgpu; egui 0.31 pins wgpu 24 / winit 0.30)
# accesskit: screen readers and keyboard users reach the UI through the platform's accessibility API.
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland", "accesskit"] }
egui = { version = "0.31", default-features = false }
egui-wgpu = "0.31"
bytemuck = { version = "1", features = ["derive"] }
rfd = "0.15"

# Linear algebra & graphs
glam = { version = "0.29", features = ["bytemuck"] }
nalgebra = "0.33"
petgraph = { version = "0.7", features = ["serde-1"] }

# Pure-Rust B-Rep kernel
truck-modeling = "0.6"
truck-meshalgo = "0.4"
truck-stepio = "0.3"
truck-topology = "0.6"
truck-shapeops = { version = "0.4", default-features = false }

# Documents and export
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Utilities
log = "0.4"
anyhow = "1.0"

# truck tessellation and the LM solver are painfully slow unoptimised.
[profile.dev.package."*"]
opt-level = 2

# truck's debug-only checks (`debug_new`) refuse the seam faces of imported STEP cylinders, which
# it meshes fine; release builds never run them.
[profile.dev.package.truck-topology]
debug-assertions = false

# Our kernel bridge runs the same hot loops (naming, topology) on every rebuild.
[profile.dev.package.threebcad-kernel]
opt-level = 2
