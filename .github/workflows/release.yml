name: Release

# Publishes a release whenever main carries a Cargo.toml version that has no tag yet (merging the
# "chore(release): vX.Y.Z" pull request opened by release-pr.yml). See RELEASING.md.
on:
  push:
    branches: [main]
    paths: [Cargo.toml]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        name: Release only versions that are not tagged yet
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "threebcad-app") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released; nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - name: CHANGELOG.md must have notes for this version
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: sh .github/scripts/changelog-section.sh "$VERSION"

  build:
    needs: verify
    if: needs.verify.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64 }
          - { os: macos-latest, name: macos-universal }
          # Oldest supported runner, so the binary works on older glibc distros.
          - { os: ubuntu-22.04, name: linux-x64 }
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      PKG: 3BCAD-${{ needs.verify.outputs.version }}-${{ matrix.name }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo build --release --locked
          mkdir -p "dist/$PKG"
          cp target/release/3bcad.exe README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "dist/$PKG/"
          cd dist && 7z a "$PKG.zip" "$PKG"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          app="dist/$PKG/3BCAD.app"
          mkdir -p "$app/Contents/MacOS"
          lipo -create -output "$app/Contents/MacOS/3bcad" \
            target/aarch64-apple-darwin/release/3bcad target/x86_64-apple-darwin/release/3bcad
          # Bundle versions must be plain dotted numbers, so drop any -beta.N suffix.
          sed "s/@VERSION@/${VERSION%%-*}/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"
          # Ad-hoc signature: required for Apple Silicon to launch it (not a Developer ID signature).
          codesign --force --deep --sign - "$app"
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "dist/$PKG/"
          cd dist && ditto -c -k --keepParent "$PKG" "$PKG.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked
          mkdir -p "dist/$PKG"
          cp target/release/3bcad README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "dist/$PKG/"
          tar -C dist -czf "dist/$PKG.tar.gz" "$PKG"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          sh .github/scripts/changelog-section.sh "$VERSION" > notes.md
          (cd dist && sha256sum -- * > SHA256SUMS.txt)
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          # Creates the tag on the commit that was built.
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" \
            --title "3BCAD v$VERSION" --notes-file notes.md $prerelease
