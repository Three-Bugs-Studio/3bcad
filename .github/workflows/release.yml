name: Release

# Publishes a release whenever main carries a Cargo.toml version that has no tag yet (merging the
# "chore(release): vX.Y.Z" pull request opened by release-pr.yml). See RELEASING.md.
on:
  push:
    branches: [main]
    paths: [Cargo.toml]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        name: Release only versions that are not tagged yet
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "threebcad-app") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released; nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - name: CHANGELOG.md must have notes for this version
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: sh .github/scripts/changelog-section.sh "$VERSION"

  # The downloads, built (and signed, when its secrets exist) by package.yml.
  build:
    needs: verify
    if: needs.verify.outputs.release == 'true'
    uses: ./.github/workflows/package.yml
    secrets: inherit

  release:
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          # Download links first, so nobody has to pick one of eight files from the asset list.
          dl="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION"
          {
            echo "**Download:** [Windows](${dl}/3BCAD-windows-x64.msi) · [macOS](${dl}/3BCAD-macos-universal.dmg) ·" \
              "[Linux](${dl}/3BCAD-linux-x86_64.AppImage). Portable archives and checksums are under *Assets*;" \
              "see [Installing 3BCAD](https://three-bugs-studio.github.io/3bcad/guide/installing.html)."
            echo
            sh .github/scripts/changelog-section.sh "$VERSION"
          } > notes.md
          (cd dist && sha256sum -- * > SHA256SUMS.txt)
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          # Creates the tag on the commit that was built.
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" \
            --title "3BCAD v$VERSION" --notes-file notes.md $prerelease
