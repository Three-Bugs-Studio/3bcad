name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          # The runner's Azure apt mirror sometimes cannot be resolved; use the main Ubuntu archive.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
          fi
          for attempt in 1 2 3; do
            sudo apt-get -o Acquire::Retries=3 update &&
              sudo apt-get -o Acquire::Retries=3 install -y libgtk-3-dev libxkbcommon-dev libwayland-dev &&
              exit 0
            echo "apt attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          exit 1
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # STEP export read back by OpenCASCADE (the kernel behind FreeCAD), checking volume and product name.
  step-occt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cadquery-ocp
      # Tests run in the crate folder, so the output folder must be absolute.
      - run: STEP_OUT="$GITHUB_WORKSPACE/step-out" cargo test -p threebcad-io --test step_roundtrip -- --ignored
      - run: python .github/scripts/occt_step_check.py "$GITHUB_WORKSPACE/step-out"
