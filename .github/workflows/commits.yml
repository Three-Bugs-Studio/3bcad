name: Commits

# Release automation reads commit messages, so every commit must be a Conventional Commit,
# e.g. "feat(sketch): add arc tool" or "fix(io): correct STL header". See CONTRIBUTING.md.
on:
  pull_request:

permissions:
  contents: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit messages
        env:
          BASE: origin/${{ github.base_ref }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/release.py check-commits "$BASE" "$HEAD"
      - name: Test the release scripts
        run: python3 -m unittest discover -s .github/scripts -v
