name: Bug report
description: Something is broken or produces wrong geometry
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Click Features > Box
        2. Set Depth to ...
        3. Export 3MF
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 3BCAD version or commit
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: OS and GPU
      placeholder: Windows 11, NVIDIA RTX 3060 (Vulkan)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log file and crash report
      description: >-
        In 3BCAD, click **Help → Open Log Folder**. Drag `3bcad.log` (and any `crash-*.txt`, written when
        3BCAD crashed) into this box, or paste the lines around the problem. `3bcad.1.log` is the run before.
      placeholder: Drop 3bcad.log and crash-*.txt here
