name: Feature request
description: Suggest a modelling feature, export option or workflow improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to make?
      description: Describe the part or workflow, and what is hard or impossible today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work? References to other CAD tools are welcome.
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I'd like to help implement this
