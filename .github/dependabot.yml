# Dependabot only opens pull requests for security fixes (Dependabot security updates, turned on in
# the repository's settings): open-pull-requests-limit 0 turns routine version bumps off.
# The prefixes keep its commits Conventional, so the Commits check and the release automation accept them.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: fix
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: ci
      include: scope
